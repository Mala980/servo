name: Linux Arm64
on:
  workflow_call:
    outputs:
      artifact_ids:
        value: ${{ jobs.linux-arm64.outputs.artifact_ids }}
        description: Comma-separated list of artifact IDs for the release artifacts
    inputs:
      profile:
        required: false
        default: "checked-release"
        type: string
      build-args:
        default: ""
        required: false
        type: string
      wpt-args:
        default: ""
        required: false
        type: string
      wpt-sync-from-upstream:
        required: false
        default: false
        type: boolean
      wpt:
        required: false
        type: boolean
      number-of-wpt-chunks:
        default: 20
        required: false
        type: number
      unit-tests:
        required: false
        default: false
        type: boolean
      devtools-tests:
        required: false
        default: false
        type: boolean
      build-libservo:
        required: false
        default: false
        type: boolean
      force-github-hosted-runner:
        required: false
        type: boolean
        default: false
      bencher:
        required: false
        default: false
        type: boolean
      coverage:
        required: false
        default: false
        type: boolean
      capi:
        required: false
        default: false
        type: boolean
      smoke-sites:
        required: false
        default: ""
        type: string

  workflow_dispatch:
    inputs:
      profile:
        required: false
        default: "checked-release"
        type: choice
        options: ["checked-release", "release", "debug", "production"]
      wpt-args:
        default: ""
        required: false
        type: string
      wpt-sync-from-upstream:
        default: false
        required: false
        type: boolean
      wpt:
        required: false
        type: boolean
      number-of-wpt-chunks:
        default: 20
        required: false
        type: number
      unit-tests:
        required: false
        default: false
        type: boolean
      devtools-tests:
        required: false
        default: false
        type: boolean
      build-libservo:
        required: false
        default: false
        type: boolean
      force-github-hosted-runner:
        required: false
        type: boolean
        default: false
      bencher:
        required: false
        default: false
        type: boolean
      capi:
        required: false
        default: false
        type: boolean
      smoke-sites:
        default: "https://terabox.com,https://v1.voratoon.com"
        required: false
        type: string

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash

jobs:
  linux-arm64:
    name: Call common linux workflow for arm64
    uses: ./.github/workflows/linux-common.yml
    secrets: inherit
    with:
      arch: arm64
      github-runner-label: ubuntu-22.04-arm
      self-hosted-image-name: "" # We don't have any self-hosted arm64 runners.
      force-github-hosted-runner: true
      uploaded-artifact-name: ${{ inputs.profile }}-binary-linux-arm64
      profile: ${{ inputs.profile }}
      build-args: ${{ inputs.build-args }}
      wpt: ${{ inputs.wpt == true || inputs.wpt == 'true' }}
      # `workflow_dispatch` delivers number/boolean inputs as strings, which a
      # reusable workflow's `type: number`/`type: boolean` inputs reject, so
      # coerce them explicitly (this also covers the empty-string defaults
      # that the dispatch API sends for untouched booleans).
      # `workflow_dispatch` delivers number/boolean inputs as strings, which a
      # reusable workflow's `type: number`/`type: boolean` inputs reject, and
      # an untouched string input can arrive as an empty string, so coerce
      # them explicitly.
      number-of-wpt-chunks: ${{ fromJSON(inputs.number-of-wpt-chunks || '20') }}
      unit-tests: ${{ inputs.unit-tests == true || inputs.unit-tests == 'true' }}
      devtools-tests: ${{ inputs.devtools-tests == true || inputs.devtools-tests == 'true' }}
      build-libservo: ${{ inputs.build-libservo == true || inputs.build-libservo == 'true' }}
      wpt-args: ${{ inputs.wpt-args }}
      bencher: ${{ inputs.bencher == true || inputs.bencher == 'true' }}
      coverage: ${{ inputs.coverage == true || inputs.coverage == 'true' }}
      capi: ${{ inputs.capi == true || inputs.capi == 'true' }}
      smoke-sites: ${{ inputs.smoke-sites || 'https://terabox.com,https://v1.voratoon.com' }}

