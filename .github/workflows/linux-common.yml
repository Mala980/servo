name: Linux Common
on:
  workflow_call:
    outputs:
      artifact_ids:
        value: ${{ jobs.build.outputs.artifact_ids }}
        description: Comma-separated list of artifact IDs for the release artifacts
    inputs:
      arch:
        required: true
        type: string
      github-runner-label:
        required: true
        type: string
      uploaded-artifact-name:
        required: true
        type: string
      self-hosted-image-name:
        required: true
        type: string
      profile:
        required: false
        default: "checked-release"
        type: string
      build-args:
        default: ""
        required: false
        type: string
      wpt-args:
        default: ""
        required: false
        type: string
      wpt-sync-from-upstream:
        required: false
        default: false
        type: boolean
      wpt:
        required: false
        type: boolean
      number-of-wpt-chunks:
        default: 20
        required: false
        type: number
      unit-tests:
        required: false
        default: false
        type: boolean
      devtools-tests:
        required: false
        default: false
        type: boolean
      build-libservo:
        required: false
        default: false
        type: boolean
      force-github-hosted-runner:
        required: false
        type: boolean
        default: false
      bencher:
        required: false
        default: false
        type: boolean
      coverage:
        required: false
        default: false
        type: boolean
      capi:
        required: false
        default: false
        type: boolean
      smoke-sites:
        required: false
        default: ""
        type: string

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash

jobs:
  runner-select:
    runs-on: ubuntu-24.04
    outputs:
      unique-id: ${{ steps.select.outputs.unique-id }}
      selected-runner-label: ${{ steps.select.outputs.selected-runner-label }}
      runner-type-label: ${{ steps.select.outputs.runner-type-label }}
      is-self-hosted: ${{ steps.select.outputs.is-self-hosted }}
    steps:
      - name: Runner select
        id: select
        uses: servo/ci-runners/actions/runner-select@a05e7e830e3f4d4c71bdc5a38f003f052b72668c
        with:
          GITHUB_TOKEN: ${{ github.token }}
          github-hosted-runner-label: ${{ inputs.github-runner-label }}
          self-hosted-image-name: ${{ inputs.self-hosted-image-name }}
          # You can disable self-hosted runners globally by creating a repository variable named
          # NO_SELF_HOSTED_RUNNERS with any non-empty value.
          # <https://github.com/servo/servo/settings/variables/actions>
          NO_SELF_HOSTED_RUNNERS: ${{ vars.NO_SELF_HOSTED_RUNNERS }}
          # Any other boolean conditions that disable self-hosted runners go here.
          force-github-hosted-runner: ${{ inputs.force-github-hosted-runner }}

  build:
    needs:
      - runner-select
    name: Linux Build (${{ inputs.arch }}) [${{ needs.runner-select.outputs.unique-id }}]
    runs-on: ${{ needs.runner-select.outputs.selected-runner-label }}
    outputs:
      artifact_ids: ${{ steps.artifact_ids.outputs.artifact_ids }}
    steps:
      - uses: servo/ci-runners/actions/checkout@a05e7e830e3f4d4c71bdc5a38f003f052b72668c
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH env
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> $GITHUB_ENV
      - name: Setup Python
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        if: ${{ runner.environment != 'self-hosted' }}
        uses: ./.github/actions/apt-mirrors
      - name: Install cargo nextest
        if: ${{ inputs.unit-tests }}
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.140
      - name: Bootstrap dependencies
        if: ${{ runner.environment != 'self-hosted' }}
        timeout-minutes: 30
        run: |
          sudo apt update
          echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
          sudo apt install -qy tshark shellcheck
          ./mach bootstrap --yes --skip-lints --skip-nextest

      # Only enable `sccache` on forks. On the main repository we suffer from too much cache-trashing,
      # and also don't need it for builds running on our self-hosted runners (cached cargo target directory).
      # On forks expected activity is much lower, so the 10GB cache will be sufficient for the expected
      # use-case of running `./mach try linux-wpt`.
      # `sccache` can be turned off by adding a repository-level variable SCCACHE_GHA_ENABLED and
      # setting the value to `false`. See <https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-variables#creating-configuration-variables-for-a-repository>.
      - name: Install sccache
        if: ${{ github.repository != 'servo/servo' && vars.SCCACHE_GHA_ENABLED != 'false' }}
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache
        if: ${{ github.repository != 'servo/servo' && vars.SCCACHE_GHA_ENABLED != 'false' }}
        run: |
          {
            # Set / Increment SCCACHE_GHA_VERSION as a repository level variable in your fork
            # to purge the cache, if you believe you're encountering issues.
            echo "SCCACHE_GHA_VERSION=${{ vars.SCCACHE_GHA_VERSION || '1' }}"
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            # sccache cannot cache incremental compilation.
            echo "CARGO_INCREMENTAL=0"
          } >> $GITHUB_ENV

      # Always install crown, even on self-hosted runners, because it is tightly
      # coupled to the rustc version, and we may have the wrong version if the
      # commit we are building uses a different rustc version.
      - name: Install crown
        run: cargo install --path support/crown

      - name: Build (${{ inputs.profile }})
        env:
          RUSTFLAGS: ${{ inputs.profile == 'checked-release' && '-D warnings' || '' }}
        run: |
          ./mach build --use-crown --locked --profile ${{ inputs.profile }} ${{ inputs.build-args }}
          mv target/cargo-timings target/cargo-timings-linux
      - name: Smoketest
        run: xvfb-run ./mach smoketest --profile ${{ inputs.profile  }}
      - name: Script tests
        run: ./mach test-scripts
      - name: Unit tests
        id: run_unit_tests
        if: ${{ inputs.unit-tests }}
        env:
          NEXTEST_RETRIES: 2 # https://github.com/servo/servo/issues/30683
          LANG: en-US
        run: |
          ./mach test-unit --profile ${{ inputs.profile }} --nextest-profile ci
          ./mach test-unit --profile ${{ inputs.profile }} --doc
      # We upload the test-results to Codecov to help us identify flaky unit-tests.
      - name: Upload test results to Codecov
        # Upload test results to Codecov, also for failed unit-tests, but only
        # if unit-tests were supposed to run, and not if they were skipped (e.g., due
        # to an earlier failure).
        if: ${{ !cancelled() && steps.run_unit_tests.conclusion != 'skipped' }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: target/nextest/ci/junit.xml
          disable_search: true
          flags: unittests,unittests-linux,unittests-linux-${{ inputs.profile }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Devtools tests
        if: ${{ inputs.devtools-tests }}
        run: ./mach test-devtools --profile ${{ inputs.profile }}
      - name: Archive build timing
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-linux-${{ inputs.profile }}
          # Using a wildcard here ensures that the archive includes the path.
          path: target/cargo-timings-*
          if-no-files-found: error
      - name: Build mach package
        run: ./mach package --profile ${{ inputs.profile }}
      - name: Upload artifact for mach package
        uses: actions/upload-artifact@v7
        id: upload-tarball
        with:
          name: ${{ inputs.uploaded-artifact-name }}
          path: target/${{ inputs.profile }}/servo-tech-demo.tar.gz
          if-no-files-found: error
      - name: Functional test (render + CDP)
        # The artifact is already uploaded, so a failure here can never lose
        # the binary; it only signals that the shipped build misbehaves.
        if: ${{ inputs.arch == 'arm64' }}
        shell: bash
        run: |
          set -u
          mkdir -p smoke-out
          BIN="target/${{ inputs.profile }}/servoshell"
          if [ ! -x "$BIN" ]; then
            BIN=$(find target -maxdepth 4 -type f -name servoshell -not -path '*packaging-temp*' 2>/dev/null | head -1)
          fi
          if [ -z "${BIN:-}" ] || [ ! -x "$BIN" ]; then
            echo "Cannot find the built servoshell binary"; find target -maxdepth 4 -name 'servo*' | head -20; exit 1
          fi
          echo "Using binary: $BIN"
          # 1. Plain headless render: CLI screenshot mode over the network.
          timeout 120 xvfb-run -a "$BIN" -z -f -o smoke-out/render.png https://example.com \
            || echo "::warning::CLI screenshot mode exited non-zero"
          if [ -s smoke-out/render.png ] && [ "$(head -c 4 smoke-out/render.png)" = $'\x89PNG' ]; then
            echo "SMOKE-CHECK CLI screenshot (-o): PASS ($(stat -c%s smoke-out/render.png) bytes)"
          else
            echo "SMOKE-CHECK CLI screenshot (-o): FAIL"; ls -la smoke-out/; exit 1
          fi
          # 2. Full CDP remote debugging session over the WebSocket protocol.
          timeout 300 xvfb-run -a "$BIN" -z -f --remote-debugging-port 9222 \
            --remote-debugging-listen-address 127.0.0.1 about:blank \
            > smoke-out/cdp-server.log 2>&1 &
          SERVER_PID=$!
          SERVER_FAILED=0
          timeout 240 python3 - <<'PYEOF' || SERVER_FAILED=1
          import base64, hashlib, json, os, socket, struct, sys, time, urllib.request
          from urllib.parse import urlsplit

          HOST, PORT = "127.0.0.1", 9222
          results = []

          def check(name, ok, detail="", critical=True):
              results.append({"name": name, "ok": bool(ok), "critical": bool(critical), "detail": str(detail)[:400]})
              print(f"SMOKE-CHECK {name}: {'PASS' if ok else 'FAIL'} {detail}", flush=True)

          def http_get(path, timeout=5):
              with urllib.request.urlopen(f"http://{HOST}:{PORT}{path}", timeout=timeout) as r:
                  return json.loads(r.read().decode())

          ver = None
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  ver = http_get("/json/version")
                  break
              except Exception:
                  time.sleep(0.5)
          if ver is None:
              check("CDP server up", False, "/json/version unreachable within 30s")
              json.dump({"results": results}, open("smoke-out/cdp_results.json", "w"))
              sys.exit(1)
          print("version JSON:", json.dumps(ver)[:500], flush=True)
          check("CDP server up", True)
          check("Browser advertises Chrome", ver.get("Browser", "").startswith("Chrome/"), ver.get("Browser"))
          check("UA is Chrome-shaped (anti-bot)", "Chrome/" in ver.get("User-Agent", ""), ver.get("User-Agent"))
          targets = http_get("/json/list")
          check("/json/list non-empty", isinstance(targets, list) and len(targets) >= 1, f"{len(targets)} target(s)")

          class WS:
              def __init__(self, url):
                  parts = urlsplit(url)
                  self.s = socket.create_connection((parts.hostname, parts.port), timeout=30)
                  key = base64.b64encode(os.urandom(16)).decode()
                  self.s.sendall((
                      f"GET {parts.path} HTTP/1.1\r\nHost: {parts.hostname}:{parts.port}\r\n"
                      "Upgrade: websocket\r\nConnection: Upgrade\r\n"
                      f"Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n"
                  ).encode())
                  buf = b""
                  while b"\r\n\r\n" not in buf:
                      buf += self.s.recv(4096)
                  head, _, rest = buf.partition(b"\r\n\r\n")
                  assert b" 101 " in b" " + head.split(b"\r\n")[0] + b" ", head
                  expect = base64.b64encode(hashlib.sha1((key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").encode()).digest())
                  assert expect in head, "bad Sec-WebSocket-Accept"
                  self.buf = rest

              def _read(self, n):
                  while len(self.buf) < n:
                      data = self.s.recv(65536)
                      if not data:
                          raise EOFError("websocket closed")
                      self.buf += data
                  out, self.buf = self.buf[:n], self.buf[n:]
                  return out

              def send(self, obj):
                  data = json.dumps(obj).encode()
                  mask = os.urandom(4)
                  n = len(data)
                  if n < 126:
                      header = b"\x81" + bytes([0x80 | n])
                  elif n < 65536:
                      header = b"\x81" + bytes([0x80 | 126]) + struct.pack(">H", n)
                  else:
                      header = b"\x81" + bytes([0x80 | 127]) + struct.pack(">Q", n)
                  self.s.sendall(header + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(data)))

              def recv_msg(self):
                  while True:
                      b1, b2 = self._read(2)
                      op, ln = b1 & 0x0F, b2 & 0x7F
                      if ln == 126:
                          ln = struct.unpack(">H", self._read(2))[0]
                      elif ln == 127:
                          ln = struct.unpack(">Q", self._read(8))[0]
                      if b2 & 0x80:
                          self._read(4)
                      payload = self._read(ln)
                      if op == 0x9:  # ping -> pong
                          self.s.sendall(b"\x8a\x80" + os.urandom(4))
                          continue
                      if op in (0x1, 0x2):
                          return payload.decode("utf-8", "replace")
                      if op == 0x8:
                          raise EOFError("websocket closed by server")

          ws = WS(ver["webSocketDebuggerUrl"])
          next_id, events = [0], []

          def cmd(method, params=None, session=None, timeout=30):
              next_id[0] += 1
              msg = {"id": next_id[0], "method": method}
              if params:
                  msg["params"] = params
              if session:
                  msg["sessionId"] = session
              ws.send(msg)
              deadline = time.time() + timeout
              while time.time() < deadline:
                  payload = ws.recv_msg()
                  if not payload.strip():
                      continue
                  reply = json.loads(payload)
                  if reply.get("id") == next_id[0]:
                      return reply
                  events.append(reply)
              raise TimeoutError(method)

          r = cmd("Target.getTargets")
          infos = r.get("result", {}).get("targetInfos", [])
          check("Target.getTargets", "result" in r and isinstance(infos, list), r.get("error") or f"{len(infos)} target(s)")

          r = cmd("Target.createTarget", {"url": "https://example.com"})
          tid = r.get("result", {}).get("targetId")
          check("Target.createTarget", bool(tid), r.get("error") or tid)

          r = cmd("Target.attachToTarget", {"targetId": tid, "flatten": True})
          sid = r.get("result", {}).get("sessionId")
          if not sid:
              for ev_ in events:
                  if ev_.get("method") == "Target.attachedToTarget" and \
                          tid in json.dumps(ev_.get("params", {})):
                      sid = ev_["params"].get("sessionId")
                      break
          check("Target.attachToTarget (flatten)", bool(sid), r.get("error") or sid)

          def ev(expr):
              return cmd("Runtime.evaluate", {"expression": expr, "returnByValue": True}, session=sid)

          r = ev("location.href")
          print("INITIAL-LOCATION:", r.get("result", {}).get("result", {}).get("value"), flush=True)

          def wait_for_title(seconds):
              title, deadline = None, time.time() + seconds
              while time.time() < deadline:
                  r = ev("document.title")
                  title = r.get("result", {}).get("result", {}).get("value")
                  if title == "Example Domain":
                      break
                  time.sleep(1)
              return title

          title = wait_for_title(60)
          if title != "Example Domain":
              # createTarget carries the url through the embedder LoadUrl
              # path; if that navigation did not land, drive it through
              # Runtime.evaluate instead and log the difference loudly.
              print("LOADURL-PATH: navigation did not land, using evaluate fallback", flush=True)
              ev("location.href = 'https://example.com'")
              title = wait_for_title(60)
              r = ev("location.href")
              print("POST-FALLBACK-LOCATION:", r.get("result", {}).get("result", {}).get("value"), flush=True)
          check("Navigate + Runtime.evaluate title", title == "Example Domain", title)

          r = ev("navigator.userAgent")
          ua = r.get("result", {}).get("result", {}).get("value", "")
          check("navigator.userAgent Chrome-shaped", "Chrome/" in ua, ua)

          r = ev("String(navigator.webdriver)")
          wd = r.get("result", {}).get("result", {}).get("value")
          check("navigator.webdriver hidden", wd == "false", wd)

          r = ev("'4 ' + new Date(0).toISOString()")
          js = r.get("result", {}).get("result", {}).get("value", "")
          check("JS engine sanity", js.startswith("4 1970-"), js)

          r = cmd("Page.bringToFront", session=sid)
          check("Page.bringToFront", "result" in r and not r.get("error"), r.get("error"))

          r = cmd("Page.captureScreenshot", {"format": "png"}, session=sid, timeout=45)
          data = r.get("result", {}).get("data")
          if data:
              png = base64.b64decode(data)
              ok = png[:8] == b"\x89PNG\r\n\x1a\n" and len(png) > 100
              check("Page.captureScreenshot", ok, f"{len(png)} bytes PNG")
              if ok:
                  open("smoke-out/cdp_screenshot.png", "wb").write(png)
          else:
              check("Page.captureScreenshot", False, r.get("error") or r)

          r = cmd("Emulation.setUserAgentOverride", {"userAgent": "SmokeTest/1.0"}, session=sid)
          check("Emulation.setUserAgentOverride accepted", "result" in r and not r.get("error"), r.get("error"), critical=False)

          r = cmd("Target.closeTarget", {"targetId": tid})
          check("Target.closeTarget", "result" in r and not r.get("error"), r.get("error"), critical=False)

          json.dump({"results": results}, open("smoke-out/cdp_results.json", "w"), indent=1)
          bad = [x for x in results if x["critical"] and not x["ok"]]
          print(f"SMOKE SUMMARY: {len(results) - len(bad)}/{len(results)} checks passed", flush=True)
          if bad:
              print("Failed checks:", [x["name"] for x in bad])
              sys.exit(1)
          PYEOF
          grep -a "DevTools listening on" smoke-out/cdp-server.log || true
          kill $SERVER_PID 2>/dev/null || true
          if [ "$SERVER_FAILED" = "1" ]; then
            echo "### CDP functional test FAILED"; tail -40 smoke-out/cdp-server.log; exit 1
          fi
          echo "### CDP functional test PASSED"
      - name: Site load test (headless + windowed)
        if: ${{ inputs.arch == 'arm64' && inputs.smoke-sites != '' }}
        env:
          SMOKE_SITES: ${{ inputs.smoke-sites }}
        shell: bash
        run: |
          set -u
          BIN="target/${{ inputs.profile }}/servoshell"
          if [ ! -x "$BIN" ]; then
            BIN=$(find target -maxdepth 4 -type f -name servoshell -not -path '*packaging-temp*' 2>/dev/null | head -1)
          fi
          if [ -z "${BIN:-}" ] || [ ! -x "$BIN" ]; then
            echo "Cannot find the built servoshell binary"; exit 1
          fi
          echo "Using binary: $BIN; sites: $SMOKE_SITES"
          mkdir -p smoke-out
          SITE_FAILED=0
          # Kill any leftover automation servo from earlier steps that could
          # still hold the debugging ports, and let the sockets settle.
          pkill -f "remote-debugging-port" 2>/dev/null || true
          sleep 2
          run_mode() {
            local mode="$1" port="$2" extra="$3" pid failed=0
            echo "=== Site load test: mode=$mode port=$port ==="
            pkill -f "remote-debugging-port $port" 2>/dev/null || true
            sleep 1
            timeout 1200 xvfb-run -a "$BIN" $extra -f --remote-debugging-port "$port" \
              --remote-debugging-listen-address 127.0.0.1 about:blank \
              > "smoke-out/site-$mode-server.log" 2>&1 &
            pid=$!
            timeout 1050 python3 - "$mode" "$port" <<'PYEOF' || failed=1
          import base64, hashlib, json, os, socket, struct, sys, time, urllib.request
          from urllib.parse import urlsplit

          mode, port = sys.argv[1], int(sys.argv[2])
          HOST = "127.0.0.1"
          sites = [s.strip() for s in os.environ.get("SMOKE_SITES", "").split(",") if s.strip()]
          results = []

          def check(name, ok, detail="", critical=True):
              results.append({"name": name, "ok": bool(ok), "critical": bool(critical), "detail": str(detail)[:300]})
              print(f"SMOKE-CHECK {name}: {'PASS' if ok else 'FAIL'} {str(detail)[:200]}", flush=True)

          def http_get(path, timeout=5):
              with urllib.request.urlopen(f"http://{HOST}:{port}{path}", timeout=timeout) as r:
                  return json.loads(r.read().decode())

          ver = None
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  ver = http_get("/json/version")
                  break
              except Exception:
                  time.sleep(0.5)
          if ver is None:
              check(f"{mode} CDP server up", False, "/json/version unreachable")
              sys.exit(1)
          check(f"{mode} CDP server up", True)

          # Do not connect during startup: wait until the browser has fully
          # initialized and registered at least one page target (this is the
          # same readiness signal Puppeteer/Playwright wait for).
          targets = None
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  t = http_get("/json/list")
                  if isinstance(t, list) and t:
                      targets = t
                      break
              except Exception:
                  pass
              time.sleep(1)
          if not targets:
              check(f"{mode} page target registered", False,
                    "/json/list never showed a page target within 60s")
              sys.exit(1)
          check(f"{mode} page target registered", True, f"{len(targets)} target(s)")

          class WS:
              def __init__(self, url, timeout=70):
                  parts = urlsplit(url)
                  self.s = socket.create_connection((parts.hostname, parts.port), timeout=timeout)
                  key = base64.b64encode(os.urandom(16)).decode()
                  self.s.sendall((
                      f"GET {parts.path} HTTP/1.1\r\nHost: {parts.hostname}:{parts.port}\r\n"
                      "Upgrade: websocket\r\nConnection: Upgrade\r\n"
                      f"Sec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n"
                  ).encode())
                  buf = b""
                  while b"\r\n\r\n" not in buf:
                      buf += self.s.recv(4096)
                  head, _, rest = buf.partition(b"\r\n\r\n")
                  assert b" 101 " in b" " + head.split(b"\r\n")[0] + b" ", head
                  expect = base64.b64encode(hashlib.sha1((key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").encode()).digest())
                  assert expect in head, "bad Sec-WebSocket-Accept"
                  self.buf = rest

              def _read(self, n):
                  while len(self.buf) < n:
                      data = self.s.recv(65536)
                      if not data:
                          raise EOFError("websocket closed")
                      self.buf += data
                  out, self.buf = self.buf[:n], self.buf[n:]
                  return out

              def send(self, obj):
                  data = json.dumps(obj).encode()
                  mask = os.urandom(4)
                  n = len(data)
                  if n < 126:
                      header = b"\x81" + bytes([0x80 | n])
                  elif n < 65536:
                      header = b"\x81" + bytes([0x80 | 126]) + struct.pack(">H", n)
                  else:
                      header = b"\x81" + bytes([0x80 | 127]) + struct.pack(">Q", n)
                  self.s.sendall(header + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(data)))

              def recv_msg(self):
                  frag = bytearray()
                  while True:
                      b1, b2 = self._read(2)
                      fin, op, ln = b2 & 0x80, b1 & 0x0F, b2 & 0x7F
                      if ln == 126:
                          ln = struct.unpack(">H", self._read(2))[0]
                      elif ln == 127:
                          ln = struct.unpack(">Q", self._read(8))[0]
                      if b2 & 0x80:
                          self._read(4)
                      payload = self._read(ln)
                      if op == 0x9:
                          self.s.sendall(b"\x8a\x80" + os.urandom(4))
                          continue
                      if op == 0x8:
                          raise EOFError("websocket closed by server")
                      if op in (0x1, 0x2) and not fin:
                          frag += payload
                          continue
                      if op == 0x0:
                          frag += payload
                          if fin:
                              msg = bytes(frag)
                              frag = bytearray()
                              return msg.decode("utf-8", "replace")
                          continue
                      return payload.decode("utf-8", "replace")

          ws, last_err = None, None
          for attempt in range(3):
              try:
                  ws = WS(ver["webSocketDebuggerUrl"])
                  break
              except (OSError, EOFError, AssertionError) as e:
                  last_err = e
                  print(f"WS-RETRY {mode}: attempt {attempt + 1} failed: {e!r}", flush=True)
                  time.sleep(3)
          if ws is None:
              check(f"{mode} WebSocket connect", False, repr(last_err))
              try:
                  ver2 = http_get("/json/version")
                  print(f"DIAG {mode}: /json/version still OK: "
                        f"{ver2.get('webSocketDebuggerUrl')}", flush=True)
              except Exception as e2:
                  print(f"DIAG {mode}: /json/version now fails: {e2!r}", flush=True)
              sys.exit(1)
          check(f"{mode} WebSocket connect", True)
          next_id, events = [0], []

          def cmd(method, params=None, session=None, timeout=30):
              next_id[0] += 1
              msg = {"id": next_id[0], "method": method}
              if params:
                  msg["params"] = params
              if session:
                  msg["sessionId"] = session
              ws.send(msg)
              deadline = time.time() + timeout
              while time.time() < deadline:
                  payload = ws.recv_msg()
                  if not payload.strip():
                      continue
                  reply = json.loads(payload)
                  if reply.get("id") == next_id[0]:
                      return reply
                  events.append(reply)
              raise TimeoutError(method)

          # Warm-up ladder: probe the server with increasingly demanding
          # commands so an early-startup stall becomes visible per stage.
          # Browser.getVersion is answered inline; Target.getTargets reads
          # server state; createTarget on about:blank exercises the full
          # embedder NewWindow path (the one that needs the event loop).
          def probe(method, params, ptimeout, label):
              try:
                  pr = cmd(method, params, timeout=ptimeout)
                  err = pr.get("error")
                  print(f"PROBE {mode}/{label}: {'OK' if not err else err}", flush=True)
                  return True
              except TimeoutError:
                  print(f"PROBE {mode}/{label}: TIMEOUT after {ptimeout}s", flush=True)
                  try:
                      print(f"SERVER-TAIL {mode}:\n" +
                            open(f"smoke-out/site-{mode}-server.log", errors="replace").read()[-1500:],
                            flush=True)
                  except OSError:
                      pass
                  return False
          if not probe("Browser.getVersion", None, 10, "getVersion"):
              sys.exit(1)
          if not probe("Target.getTargets", None, 15, "getTargets"):
              sys.exit(1)
          if not probe("Target.createTarget", {"url": "about:blank"}, 30, "createTarget-blank"):
              sys.exit(1)
          time.sleep(2)

          for i, site in enumerate(sites):
              name = f"{mode}/site{i}({site})"
              try:
                  r = None
                  for attempt in range(2):
                      try:
                          r = cmd("Target.createTarget", {"url": site}, timeout=45)
                          break
                      except TimeoutError:
                          if attempt == 0:
                              print(f"CREATE-RETRY {mode} {site}", flush=True)
                              time.sleep(5)
                  tid = (r or {}).get("result", {}).get("targetId")
                  if not tid:
                      check(f"{name} createTarget", False, r.get("error") or r)
                      continue
                  r = cmd("Target.attachToTarget", {"targetId": tid, "flatten": True})
                  sid = r.get("result", {}).get("sessionId")
                  if not sid:
                      for ev_ in events:
                          if ev_.get("method") == "Target.attachedToTarget" and \
                                  tid in json.dumps(ev_.get("params", {})):
                              sid = ev_["params"].get("sessionId")
                              break
                  if not sid:
                      check(f"{name} attachToTarget", False, "no sessionId")
                      continue
                  expr = ("JSON.stringify({rs: document.readyState, title: document.title,"
                          " els: document.querySelectorAll('*').length,"
                          " txt: (document.body && document.body.innerText ?"
                          " document.body.innerText.slice(0, 240) : '')})")
                  metrics = None
                  fallback = [False, ""]
                  deadline = time.time() + 120
                  while time.time() < deadline:
                      if not fallback[0] and time.time() > deadline - 90:
                          # If the embedder LoadUrl path did not land within
                          # 30s, drive the navigation through
                          # Runtime.evaluate and log the difference loudly.
                          fallback[0] = True
                          try:
                              cmd("Runtime.evaluate",
                                  {"expression": f"location.href = {json.dumps(site)}",
                                   "returnByValue": True}, session=sid, timeout=25)
                              print(f"LOADURL-PATH ({site}): navigation did not land, "
                                    "using evaluate fallback", flush=True)
                          except (TimeoutError, EOFError, OSError):
                              pass
                      try:
                          r = cmd("Runtime.evaluate", {"expression": expr, "returnByValue": True},
                                  session=sid, timeout=25)
                      except TimeoutError:
                          time.sleep(2)
                          continue
                      val = r.get("result", {}).get("result", {}).get("value")
                      if val:
                          m = json.loads(val)
                          if m.get("rs") == "complete":
                              metrics = m
                              break
                      time.sleep(2)
                  if fallback[0]:
                      try:
                          r = cmd("Runtime.evaluate", {"expression": "location.href",
                                                       "returnByValue": True}, session=sid, timeout=25)
                          print(f"POST-FALLBACK-LOCATION ({site}):",
                                r.get("result", {}).get("result", {}).get("value"), flush=True)
                      except (TimeoutError, EOFError, OSError):
                          pass
                  check(f"{name} readyState complete", bool(metrics),
                        json.dumps(metrics, ensure_ascii=False)[:280] if metrics else "timeout waiting for load")
                  els = (metrics or {}).get("els", 0)
                  check(f"{name} DOM elements >= 20", els >= 20, str(els))
                  r = cmd("Page.captureScreenshot", {"format": "png"}, session=sid, timeout=60)
                  data = r.get("result", {}).get("data")
                  size = 0
                  if data:
                      png = base64.b64decode(data)
                      size = len(png)
                      if png[:8] == b"\x89PNG\r\n\x1a\n" and size > 10000:
                          open(f"smoke-out/site-{mode}-{i}.png", "wb").write(png)
                  check(f"{name} screenshot PNG > 10KB", size > 10000, f"{size} bytes")
                  if metrics:
                      print(f"SITE-INFO {name}: title={metrics.get('title', '')[:90]!r} "
                            f"text={metrics.get('txt', '')[:200]!r}", flush=True)
                  try:
                      cmd("Target.closeTarget", {"targetId": tid}, timeout=15)
                  except (TimeoutError, EOFError, OSError):
                      pass
              except (EOFError, OSError, TimeoutError, json.JSONDecodeError) as e:
                  check(f"{name} crashed/protocol error", False, repr(e))
                  try:
                      print(f"SERVER-TAIL {mode}:\n" +
                            open(f"smoke-out/site-{mode}-server.log", errors="replace").read()[-1200:],
                            flush=True)
                  except OSError:
                      pass
          json.dump({"results": results}, open(f"smoke-out/site-{mode}-results.json", "w"), indent=1)
          bad = [x for x in results if x["critical"] and not x["ok"]]
          print(f"SMOKE SUMMARY ({mode}): {len(results) - len(bad)}/{len(results)} checks passed", flush=True)
          if bad:
              print("Failed checks:", [x["name"] for x in bad])
              sys.exit(1)
          PYEOF
            kill $pid 2>/dev/null || true
            pkill -f "remote-debugging-port $port" 2>/dev/null || true
            wait $pid 2>/dev/null || true
            sleep 2
            if [ "$failed" = "1" ]; then
              echo "### mode $mode FAILED"; tail -30 "smoke-out/site-$mode-server.log"; SITE_FAILED=1
            else
              echo "### mode $mode PASSED"
            fi
          }
          run_mode headless 9222 "-z"
          run_mode windowed 9223 ""
          if [ "$SITE_FAILED" = "1" ]; then
            echo "### Site load test FAILED"; exit 1
          fi
          echo "### Site load test PASSED"
      - name: Upload functional test outputs
        if: ${{ !cancelled() && inputs.arch == 'arm64' }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux-${{ inputs.arch }}-${{ inputs.profile }}
          path: smoke-out/
          if-no-files-found: ignore
      - name: Collect artifact IDs needed by the release workflow
        id: artifact_ids
        shell: bash
        run: |
          echo "artifact_ids=${{steps.upload-tarball.outputs.artifact-id}}" >> $GITHUB_OUTPUT

  build-libservo:
    if: ${{ inputs.build-libservo }}
    name: Build libservo and MSRV check (${{ inputs.arch }})
    runs-on: ${{ inputs.github-runner-label }}
    steps:
      - uses: servo/ci-runners/actions/checkout@a05e7e830e3f4d4c71bdc5a38f003f052b72668c
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH env
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> $GITHUB_ENV
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Determine MSRV
        id: msrv
        uses: ./.github/actions/parse_msrv
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.rust_version }}
      # We can remove this after upgrading to Rust 1.90, but for now
      # installing lld is the easiest way to get it in path.
      - name: install lld
        run: sudo apt-get install -y lld
      - name: Compile libservo with MSRV
        env:
          # lld seems to use less memory and prevents OOM errors during linking.
          # We can remove this after upgrading to Rust 1.90, where lld will be the default.
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
          LLVM_OBJDUMP: llvm-objdump-14
        run: |
          cargo +${{ steps.msrv.outputs.rust_version }} build -p servo --locked

  capi:
    if: ${{ inputs.capi }}
    name: Build and test Servo's C API (${{ inputs.arch }})
    runs-on: ${{ inputs.github-runner-label }}
    steps:
      - uses: servo/ci-runners/actions/checkout@a05e7e830e3f4d4c71bdc5a38f003f052b72668c
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH env
        run: echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> $GITHUB_ENV
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Change Mirror Priorities
        uses: ./.github/actions/apt-mirrors
      - name: Install EGL library and headers
        run: |
          sudo apt update
          sudo apt install -y libegl1-mesa-dev libegl-dev
      - name: Install cargo-c # required by servo-capi-tests's build.rs
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c@0.10.23
      - name: Build and test servo-capi-tests
        run: cargo test -p servo-capi-tests --locked
